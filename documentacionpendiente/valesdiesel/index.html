<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071a2d">
    <title>Vales de combustible | Próximamente</title>
    <style>
        :root {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
            color: #102650;
            background: #f2f7fc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            background: radial-gradient(circle at top, #ffffff 0, #f2f7fc 65%);
        }

        main {
            width: min(560px, calc(100% - 32px));
            padding: 42px 30px;
            border: 1px solid #dce7f2;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 16px 40px #17385a14;
            text-align: center;
        }

        .icon {
            display: grid;
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            place-items: center;
            border-radius: 50%;
            background: #e8f2ff;
            color: #1768c9;
            font-size: 30px;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 5vw, 32px);
            letter-spacing: -.03em;
        }

        p {
            margin: 12px 0 0;
            color: #64748b;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main>
        <div class="icon" aria-hidden="true">◷</div>
        <h1>Página pendiente de construcción</h1>
        <p>El apartado de vales de combustible estará disponible próximamente.</p>
    </main>
</body>

</html>
