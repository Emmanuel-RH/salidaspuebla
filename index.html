<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Consulta semanal de turnos para las salidas a Puebla." />
  <title>Salidas a Puebla | Transportes</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="https://traxion.global/es/solistica" aria-label="Visitar el sitio de Solistica">
        <img src="Recursos_Imagenes/SVG-_15-SOLISTICA%20V1%20COLOR%201.svg" alt="Solistica" />
      </a>
      <span class="nav-current" aria-current="page"> <span>Consulta Horarios</span></span>
    </div>
  </header>
  <main class="container">
    <section class="page-heading" aria-labelledby="main-title">
      <div><h1 id="main-title">Salidas a Puebla</h1><p>Consulta tu turno asignado.</p></div>
    </section>

    <section class="week-card" aria-label="Seleccionar semana">
      <div class="week-summary"><img class="calendar-icon" src="Recursos_Imagenes/61469.png" alt="" aria-hidden="true" /><div><span class="eyebrow">Semana del</span><strong id="week-label">—</strong></div></div>
      <div class="week-controls">
        <button id="prev-week" class="icon-button" type="button" aria-label="Semana anterior">‹</button>
        <label class="date-field"><span class="sr-only">Elegir una fecha de la semana</span><input id="week-input" type="date" aria-label="Selecciona una fecha de la semana" /></label>
        <button id="next-week" class="icon-button" type="button" aria-label="Semana siguiente">›</button>
        <button id="search" class="primary-button" type="button">Buscar</button>
      </div>
    </section>

    <section class="table-section" aria-label="Tabla de horarios semanales">
      <div class="table-scroll" tabindex="0" aria-label="Desplaza horizontalmente para consultar todos los días">
        <table>
          <thead><tr><th scope="col">Operador</th><th scope="col" id="d0"></th><th scope="col" id="d1"></th><th scope="col" id="d2"></th><th scope="col" id="d3"></th><th scope="col" id="d4"></th><th scope="col" id="d5"></th><th scope="col" id="d6"></th></tr></thead>
          <tbody id="schedule-body"></tbody>
        </table>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="scroll-hint">En celular, desliza la tabla horizontalmente para ver los siete días.</p>
    </section>
  </main>
</body>
</html>
